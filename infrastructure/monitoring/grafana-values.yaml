# Grafana Helm values
# Chart: https://github.com/grafana/helm-charts/tree/main/charts/grafana
# Install: helm install grafana grafana/grafana -n monitoring -f grafana-values.yaml

fullnameOverride: grafana

# Admin credentials (change in production!)
adminUser: admin
adminPassword: boltchats-dev  # Override with secret in production

# Persistence
persistence:
  enabled: true
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# Resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Service type
service:
  type: ClusterIP
  port: 80

# Ingress (optional - enable for external access)
ingress:
  enabled: false
  # Uncomment for production with ALB
  # annotations:
  #   kubernetes.io/ingress.class: alb
  #   alb.ingress.kubernetes.io/scheme: internet-facing
  # hosts:
  #   - grafana.boltchats.example.com

# Data sources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Prometheus
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 30s
      
      # Loki
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        jsonData:
          maxLines: 1000
      
      # Tempo (optional)
      - name: Tempo
        type: tempo
        url: http://tempo:3100
        access: proxy

# Dashboard providers
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'boltchats'
        orgId: 1
        folder: 'BoltChats'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/boltchats

# Pre-load dashboards
dashboards:
  boltchats:
    api-latency:
      file: dashboards/api-latency.json
    ws-connections:
      file: dashboards/ws-connections.json
    boltchats-overview:
      file: dashboards/boltchats-overview.json

# Plugins
plugins:
  - grafana-piechart-panel
  - grafana-worldmap-panel

# SMTP (for alerting - configure in production)
smtp:
  enabled: false
  # host: smtp.gmail.com:587
  # user: alerts@boltchats.com
  # password: <secret>
  # from_address: grafana@boltchats.com

# Environment variables
env:
  GF_SERVER_ROOT_URL: "http://localhost:3000"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/secrets/admin-password
  GF_INSTALL_PLUGINS: ""

# Security
securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

# Readiness/Liveness probes
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 60
  timeoutSeconds: 30

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  timeoutSeconds: 10
