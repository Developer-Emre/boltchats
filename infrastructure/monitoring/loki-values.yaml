# Loki Helm values
# Chart: https://github.com/grafana/helm-charts/tree/main/charts/loki
# Install: helm install loki grafana/loki -n monitoring -f loki-values.yaml

# Deployment mode: SingleBinary (for dev/staging) or Distributed (for prod)
loki:
  commonConfig:
    replication_factor: 1  # Set to 3 for production
  
  storage:
    type: filesystem  # Change to s3 for production
    # s3:
    #   s3: s3://region/bucket
    #   region: eu-central-1
  
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Storage
persistence:
  enabled: true
  storageClassName: gp3
  size: 30Gi

# Resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Service
service:
  type: ClusterIP
  port: 3100

# Retention (15 days)
tableManager:
  retention_deletes_enabled: true
  retention_period: 360h  # 15 days

# Limits
limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_query_length: 721h  # 30 days
  max_query_parallelism: 32

# Monitoring
serviceMonitor:
  enabled: true
  labels:
    prometheus: boltchats

# Readiness probe
readinessProbe:
  httpGet:
    path: /ready
    port: 3100
  initialDelaySeconds: 30
  timeoutSeconds: 1
