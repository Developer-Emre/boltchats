apiVersion: apps/v1
kind: Deployment
metadata:
  name: boltchats-web
  namespace: boltchats
  labels:
    app: boltchats-web
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boltchats-web
  template:
    metadata:
      labels:
        app: boltchats-web
        component: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/developer-emre/boltchats-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.boltchats.example.com/api/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://ws.boltchats.example.com/ws"
            - name: NEXT_PUBLIC_APP_NAME
              value: "boltchats"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      restartPolicy: Always
