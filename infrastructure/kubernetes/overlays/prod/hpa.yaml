apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boltchats-api-hpa
  namespace: boltchats
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: boltchats-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
