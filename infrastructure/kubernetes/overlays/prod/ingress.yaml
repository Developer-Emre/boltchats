apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boltchats-ingress
  namespace: boltchats
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - boltchats.example.com
        - api.boltchats.example.com
        - ws.boltchats.example.com
      secretName: boltchats-tls
  rules:
    # Frontend
    - host: boltchats.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boltchats-web
                port:
                  number: 3000
    # API
    - host: api.boltchats.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boltchats-api
                port:
                  number: 8000
    # WebSocket
    - host: ws.boltchats.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boltchats-ws
                port:
                  number: 8001
