# boltchats-secrets
# This is a template — DO NOT COMMIT real values
# Use kubectl create secret or SealedSecrets in production

apiVersion: v1
kind: Secret
metadata:
  name: boltchats-secrets
  namespace: boltchats
type: Opaque
stringData:
  # MongoDB credentials
  mongodb-root-username: "admin"
  mongodb-root-password: "CHANGE_ME_IN_PROD"
  
  # Redis password
  redis-password: "CHANGE_ME_IN_PROD"
  
  # JWT secret for all services
  jwt-secret: "CHANGE_ME_IN_PROD_MIN_32_CHARS"
  
  # Optional: Refresh token secret
  refresh-token-secret: "CHANGE_ME_IN_PROD_MIN_32_CHARS"
