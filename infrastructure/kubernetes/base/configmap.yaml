apiVersion: v1
kind: ConfigMap
metadata:
  name: boltchats-config
  namespace: boltchats
data:
  # ── App metadata ────────────────────────────────────────────────────────────
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"

  # ── Database ────────────────────────────────────────────────────────────────
  MONGODB_URL: "mongodb://mongodb-service.boltchats.svc.cluster.local:27017/boltchats"
  MONGODB_DB_NAME: "boltchats"

  # ── Redis ───────────────────────────────────────────────────────────────────
  REDIS_URL: "redis://redis-service.boltchats.svc.cluster.local:6379/0"
  REDIS_QUEUE_NAME: "messages:queue"

  # ── JWT ─────────────────────────────────────────────────────────────────────
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # ── CORS ────────────────────────────────────────────────────────────────────
  CORS_ORIGINS: "https://boltchats.example.com"

  # ── Rate limiting ───────────────────────────────────────────────────────────
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_CONNECTIONS_PER_USER: "5"
  RATE_LIMIT_MESSAGES_PER_SECOND: "10"

  # ── Consumer ────────────────────────────────────────────────────────────────
  CONSUMER_MAX_RETRIES: "3"
  CONSUMER_RETRY_BASE_DELAY: "1.0"
