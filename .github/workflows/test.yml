name: Unit & Integration Tests

on:
  pull_request:
    paths:
      - 'services/boltchats-api/**'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
    paths:
      - 'services/boltchats-api/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./services/boltchats-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx fakeredis

      - name: Run unit tests
        working-directory: ./services/boltchats-api
        run: |
          python -m pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./services/boltchats-api/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd mongosh --eval db.adminCommand\('ping'\)
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root

      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./services/boltchats-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run integration tests
        working-directory: ./services/boltchats-api
        env:
          MONGODB_URL: mongodb://root:root@localhost:27017/test?authSource=admin
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/integration/ -v --tb=short -m integration || true

  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./services/boltchats-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx fakeredis coverage

      - name: Generate coverage report
        working-directory: ./services/boltchats-api
        run: |
          python -m pytest tests/unit/ --cov=app --cov-report=term-missing --cov-report=html

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
