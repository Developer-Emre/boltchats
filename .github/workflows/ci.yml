name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-test-python:
    name: Lint & Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [boltchats-api, boltchats-ws, boltchats-storage]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check app/ tests/ || true

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: |
          pytest tests/ -v --tb=short

  lint-and-test-web:
    name: Lint & Test Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/boltchats-web/package-lock.json

      - name: Install dependencies
        working-directory: services/boltchats-web
        run: npm ci

      - name: Lint
        working-directory: services/boltchats-web
        run: npm run lint

      - name: Type check
        working-directory: services/boltchats-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: services/boltchats-web
        run: npm run build

