name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-api
          file: ./services/boltchats-api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-api:latest
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-api:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push WebSocket image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-ws
          file: ./services/boltchats-ws/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-ws:latest
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-ws:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Storage Worker image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-storage
          file: ./services/boltchats-storage/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-storage:latest
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-storage:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-web
          file: ./services/boltchats-web/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-web:latest
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-web:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Kubernetes (production)
        env:
          KUBECONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "$KUBECONFIG" | base64 -d > /tmp/kubeconfig.yaml
          
          # Update image tags in k8s manifests
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" infrastructure/kubernetes/overlays/prod/patch.yaml
          
          # Apply to production cluster
          kubectl --kubeconfig=/tmp/kubeconfig.yaml apply -k infrastructure/kubernetes/overlays/prod
          
          # Verify deployment (wait for rollout)
          kubectl --kubeconfig=/tmp/kubeconfig.yaml rollout status deployment/boltchats-api -n boltchats --timeout=5m

      - name: Run production smoke tests
        env:
          API_URL: https://api.example.com
        run: |
          # Wait for services to stabilize
          sleep 60
          
          # Check API health
          for i in {1..10}; do
            if curl -f ${{ env.API_URL }}/health; then
              echo "✅ API health check passed"
              break
            fi
            echo "Retry $i/10..."
            sleep 10
          done
          
          # Check database connectivity
          curl -f "${{ env.API_URL }}/health" | grep -q '"database":"ok"' || exit 1
          echo "✅ Database connectivity verified"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Production Release ${{ steps.version.outputs.VERSION }}
            
            **Services Deployed:**
            - boltchats-api:${{ steps.version.outputs.VERSION }}
            - boltchats-ws:${{ steps.version.outputs.VERSION }}
            - boltchats-storage:${{ steps.version.outputs.VERSION }}
            - boltchats-web:${{ steps.version.outputs.VERSION }}
            
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack notification — Production Deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 Production Deployment ${{ job.status }}
            Version: ${{ steps.version.outputs.VERSION }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: |
            repo,message,commit,author,action,eventName

      - name: Backup database before deployment
        if: success()
        env:
          MONGO_URI: ${{ secrets.PROD_MONGODB_URI }}
        run: |
          # This would typically be done via Atlas Backup or external service
          echo "Backup would be triggered here"

      - name: Update deployment documentation
        if: success()
        run: |
          echo "Deployment ${{ steps.version.outputs.VERSION }} completed successfully" >> DEPLOYMENT_LOG.md
          echo "- Date: $(date)" >> DEPLOYMENT_LOG.md
          echo "- Commit: ${{ github.sha }}" >> DEPLOYMENT_LOG.md
