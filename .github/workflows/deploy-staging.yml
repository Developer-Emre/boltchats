name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-api
          file: ./services/boltchats-api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-api:staging
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-api:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push WebSocket image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-ws
          file: ./services/boltchats-ws/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-ws:staging
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-ws:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Storage Worker image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-storage
          file: ./services/boltchats-storage/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-storage:staging
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-storage:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./services/boltchats-web
          file: ./services/boltchats-web/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-web:staging
            ${{ secrets.DOCKER_REGISTRY }}/boltchats-web:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Kubernetes (staging)
        env:
          KUBECONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          echo "$KUBECONFIG" | base64 -d > /tmp/kubeconfig.yaml
          
          # Update image tags in k8s manifests
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" infrastructure/kubernetes/overlays/staging/patch.yaml
          
          # Apply to staging cluster
          kubectl --kubeconfig=/tmp/kubeconfig.yaml apply -k infrastructure/kubernetes/overlays/staging
          
          # Verify deployment
          kubectl --kubeconfig=/tmp/kubeconfig.yaml rollout status deployment/boltchats-api -n boltchats

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Check API health
          curl -f https://staging-api.example.com/health || exit 1
          
          # Check WebSocket health
          curl -f https://staging-ws.example.com/health || exit 1

      - name: Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Staging Deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Branch: ${{ github.ref }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
