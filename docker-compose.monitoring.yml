# BoltChats — Monitoring Stack for Local Development
# Start: docker-compose -f docker-compose.monitoring.yml up -d
# Stop: docker-compose -f docker-compose.monitoring.yml down

version: '3.9'

services:
  # Prometheus
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: boltchats-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./infrastructure/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - boltchats-monitoring

  # Grafana
  grafana:
    image: grafana/grafana:10.2.2
    container_name: boltchats-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - boltchats-monitoring
    depends_on:
      - prometheus

  # Loki
  loki:
    image: grafana/loki:2.9.3
    container_name: boltchats-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/configs/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - boltchats-monitoring

  # Promtail (log collector)
  promtail:
    image: grafana/promtail:2.9.3
    container_name: boltchats-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/configs/promtail-config.yaml:/etc/promtail/config.yml:ro
    networks:
      - boltchats-monitoring
    depends_on:
      - loki

networks:
  boltchats-monitoring:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
